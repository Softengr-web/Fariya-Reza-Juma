<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" role="img" aria-labelledby="title">
  <title id="title">A smiling birthday girl doll</title>
  <defs>
    <linearGradient id="doll-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c4b83"/>
      <stop offset=".55" stop-color="#49355f"/>
      <stop offset="1" stop-color="#30284e"/>
    </linearGradient>
    <linearGradient id="doll-skin" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffe0c8"/>
      <stop offset="1" stop-color="#f2b99f"/>
    </linearGradient>
    <linearGradient id="doll-dress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc5e4"/>
      <stop offset=".55" stop-color="#f58bc7"/>
      <stop offset="1" stop-color="#d967ae"/>
    </linearGradient>
    <linearGradient id="doll-shoes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#528de2"/>
    </linearGradient>
    <linearGradient id="doll-eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#493454"/>
      <stop offset="1" stop-color="#211d38"/>
    </linearGradient>
    <radialGradient id="doll-blush">
      <stop offset="0" stop-color="#f58faf" stop-opacity=".72"/>
      <stop offset="1" stop-color="#f58faf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doll-bow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f7"/>
      <stop offset="1" stop-color="#f08bbb"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="360" rx="62" ry="10" fill="#10162b" opacity=".18"/>

  <!-- Soft, glossy hair behind her face -->
  <path d="M91 91C84 48 111 17 151 17c45-1 70 29 64 76l-4 70c-2 31-20 48-41 51H126c-22-4-40-23-42-52z" fill="url(#doll-hair)"/>
  <path d="M98 124c-7 29-5 56 12 73l-15 5c-19-17-24-47-18-77zm104-2c9 28 7 55-10 75l16 5c18-20 20-48 10-79z" fill="#49355f"/>
  <path d="M104 53c11-22 29-33 49-33 25 0 43 12 53 34-14-6-25-4-35 3-11 7-21 10-33 8-12-2-22-8-34-12z" fill="#9476aa" opacity=".62"/>
  <path d="M105 61c13-21 29-29 46-30m48 11c-7 2-12 7-16 12" fill="none" stroke="#c6a8d5" stroke-linecap="round" stroke-width="3" opacity=".45"/>

  <!-- Arms, hands, and legs -->
  <path d="M137 145h26v24h-26z" fill="url(#doll-skin)"/>
  <path d="M120 171c-17 6-29 20-42 37l-10 14m112-51c17 6 29 20 42 37l10 14" fill="none" stroke="#eeb59c" stroke-linecap="round" stroke-width="16"/>
  <path d="M68 218l-7 10m178-10 7 10" fill="none" stroke="#ffe0c8" stroke-linecap="round" stroke-width="11"/>
  <path d="M133 277c-2 21-5 40-7 58m42-58c2 21 5 40 7 58" fill="none" stroke="#f2c1a7" stroke-linecap="round" stroke-width="14"/>
  <path d="M111 337c9-8 22-8 31 0l4 12c-11 9-29 9-40 0zm46 0c9-8 22-8 31 0l5 12c-12 9-30 9-41 0z" fill="url(#doll-shoes)"/>
  <path d="M119 341c8 4 17 4 25 0m20 0c8 4 17 4 25 0" fill="none" stroke="#e8f3ff" stroke-linecap="round" stroke-width="3.5"/>
  <circle cx="65" cy="229" r="8" fill="#f7c5aa"/>
  <circle cx="235" cy="229" r="8" fill="#f7c5aa"/>

  <!-- Face -->
  <circle cx="96" cy="101" r="10" fill="#f2b99f"/>
  <circle cx="204" cy="101" r="10" fill="#f2b99f"/>
  <ellipse cx="150" cy="98" rx="56" ry="66" fill="url(#doll-skin)"/>
  <ellipse cx="150" cy="108" rx="48" ry="50" fill="#fff0df" opacity=".12"/>
  <path d="M94 87c2-43 31-65 61-63 29 2 49 21 52 53-12-7-20-15-25-25-9 13-22 21-39 23-16 2-31-2-47 12z" fill="url(#doll-hair)"/>
  <path d="M99 69c13-24 31-34 53-36m-43 46c-7 23-7 49 1 70" fill="none" stroke="#b397c5" stroke-linecap="round" stroke-width="4" opacity=".56"/>
  <path d="M125 90c6-6 14-6 20 0m10 0c6-6 14-6 20 0" fill="none" stroke="#493454" stroke-linecap="round" stroke-width="3.2"/>
  <path d="M128 96l-2 4m47-4 2 4" fill="none" stroke="#493454" stroke-linecap="round" stroke-width="2"/>
  <ellipse cx="135" cy="105" rx="8" ry="11" fill="url(#doll-eye)"/>
  <ellipse cx="165" cy="105" rx="8" ry="11" fill="url(#doll-eye)"/>
  <ellipse cx="137" cy="101" rx="3.2" ry="4" fill="#fff"/>
  <ellipse cx="167" cy="101" rx="3.2" ry="4" fill="#fff"/>
  <circle cx="132" cy="109" r="1.7" fill="#f9a8d4"/>
  <circle cx="162" cy="109" r="1.7" fill="#f9a8d4"/>
  <ellipse cx="119" cy="122" rx="15" ry="9" fill="url(#doll-blush)"/>
  <ellipse cx="181" cy="122" rx="15" ry="9" fill="url(#doll-blush)"/>
  <path d="M114 121h2m5 2h2m60-2h2m5 2h2" stroke="#e982a2" stroke-linecap="round" stroke-width="2" opacity=".72"/>
  <path d="M148 113c-2 5-3 8-1 10 2 2 5 2 7 0" fill="none" stroke="#dc998a" stroke-linecap="round" stroke-width="2.2"/>
  <path d="M136 132c8 10 20 10 28 0" fill="none" stroke="#bd527d" stroke-linecap="round" stroke-width="3.5"/>
  <path d="M142 132c4 3 12 3 16 0" fill="none" stroke="#fff5f4" stroke-linecap="round" stroke-width="2.3"/>

  <!-- Flower hair clip -->
  <g transform="translate(203 62) rotate(12)">
    <path d="M-10 6c-8 3-10 8-11 12 7-1 12-4 15-10m13-1c8 3 10 8 11 12-7-1-12-4-15-10" fill="#86c9aa" stroke="#6ca98f" stroke-width="1.5"/>
    <circle cy="-9" r="7" fill="#ffd2e7"/>
    <circle cx="9" cy="-3" r="7" fill="#d9ceff"/>
    <circle cx="6" cy="7" r="7" fill="#ffb6d8"/>
    <circle cx="-6" cy="7" r="7" fill="#a8d9ff"/>
    <circle cx="-9" cy="-3" r="7" fill="#ffc5e1"/>
    <circle r="4.5" fill="#ffe28a"/>
    <circle cx="-1" cy="-1" r="1.2" fill="#fff8db"/>
  </g>

  <!-- Collar, party dress, and ruffled skirt -->
  <path d="M139 147l11 11 11-11 9 11-13 12h-14l-13-12z" fill="#fff4fb"/>
  <path d="M130 151c7 7 13 10 20 10s13-3 20-10l13 10 16 42-14 10-8-11 12 75c-26 15-77 15-105 0l13-75-8 11-14-10 16-42z" fill="url(#doll-dress)"/>
  <path d="M130 154c-11 1-21 8-24 18 3 9 12 13 21 10l11-16zm40 0c11 1 21 8 24 18-3 9-12 13-21 10l-11-16z" fill="#ffc4e1" stroke="#fff0f8" stroke-width="2"/>
  <path d="M109 174c4 4 10 6 16 5m66-5c-4 4-10 6-16 5" fill="none" stroke="#fff2fa" stroke-linecap="round" stroke-width="2.5"/>
  <path d="M109 202c24 12 58 12 82 0l12 17c-30 18-77 18-107 0z" fill="#ffd5eb" opacity=".78"/>
  <path d="M91 270c34 17 84 17 118 0l-4 15c-34 17-76 17-110 0z" fill="#cf5ca5" opacity=".58"/>
  <path d="M96 279c31 13 77 13 108 0" fill="none" stroke="#ffe4f3" stroke-linecap="round" stroke-width="4" opacity=".85"/>
  <path d="M133 169c5 5 11 8 17 8s12-3 17-8" fill="none" stroke="#fff3fa" stroke-linecap="round" stroke-width="3"/>
  <path d="M126 183c-4-10-17-7-15 3 1 6 9 11 15 15 6-4 14-9 15-15 2-10-11-13-15-3z" fill="#fff3fa" opacity=".95"/>
  <circle cx="150" cy="184" r="2" fill="#f472b6"/>
  <path d="M122 199c6 3 12 4 18 4m20 0c6 0 12-1 18-4" fill="none" stroke="#fff5fb" stroke-linecap="round" stroke-width="2" opacity=".78"/>
  <circle cx="150" cy="213" r="3" fill="#ffe59a" stroke="#fff6d6" stroke-width="1.2"/>
  <circle cx="150" cy="231" r="3" fill="#ffe59a" stroke="#fff6d6" stroke-width="1.2"/>
  <circle cx="150" cy="249" r="3" fill="#ffe59a" stroke="#fff6d6" stroke-width="1.2"/>
  <path d="M104 231c10 7 22 11 35 12m57-12c-10 7-22 11-35 12" fill="none" stroke="#fff0f8" stroke-linecap="round" stroke-width="3" opacity=".65"/>
  <path d="M101 287c26 11 72 15 98 0" fill="none" stroke="#f5a6d1" stroke-linecap="round" stroke-width="2" opacity=".62"/>

  <!-- Floating sparkles -->
  <path d="M48 126l3 7 7 3-7 3-3 7-3-7-7-3 7-3zm202 57l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#93c5fd" opacity=".86"/>
  <path d="M222 105l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f9a8d4" opacity=".9"/>
</svg>

